interface:
  display_name: "Adversarial Reviewer / Acrazie"
  short_description: "Independent bug and regression review against contracts"
  default_prompt: "Use $adversarial-reviewer-acrazie in an independent context to evaluate my code diff against its contract, searching for introduced bugs, regressions, resource leaks, concurrency races, semantic drift, and forbidden workarounds without implementing fixes."
policy:
  allow_implicit_invocation: true
