name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main
      - 'release-please--**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-skills:
    name: validate-skills
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify skill directory structure
        run: ./scripts/hooks/check-skill-structure.sh

      - name: Validate SKILL.md frontmatters
        run: ./scripts/hooks/validate-skills.sh skills/*/SKILL.md

      - name: Check for forbidden files in PR diff
        if: github.event_name == 'pull_request'
        run: ./scripts/hooks/check-forbidden-files.sh "origin/${{ github.base_ref }}...HEAD"

  validate-pr-title:
    name: validate-pr-title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            test
            ci
            style
            perf
          requireScope: false

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  build-docs:
    name: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix docs

      - name: Build documentation
        run: npm run build --prefix docs

      - name: Build production container
        run: docker build --target runtime --tag acrazie-skills-ci .

      - name: Smoke test production container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1::8080 acrazie-skills-ci)
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          port=$(docker port "$container_id" 8080/tcp | awk -F: '{print $NF}')
          base_url="http://127.0.0.1:$port"

          for attempt in {1..20}; do
            if curl --fail --silent --output /dev/null "$base_url/healthz"; then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --output /tmp/skills-index.html "$base_url/"
          grep --quiet "Acrazie Skills" /tmp/skills-index.html
          curl --fail --silent --output /dev/null "$base_url/changelog/"
          curl --fail --silent --output /dev/null "$base_url/skills/canvas-banner-designer-acrazie/"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/not-found")" = "404"
          curl --fail --silent --head "$base_url/" | grep --ignore-case --quiet "content-security-policy:"
          test "$(docker inspect --format '{{.Config.User}}' acrazie-skills-ci)" = "101:101"

  deploy-production:
    name: deploy-production
    needs:
      - validate-skills
      - lint-workflows
      - build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: https://skills.acrazie.dev
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          : "${DOKPLOY_DEPLOY_URL:?Missing DOKPLOY_DEPLOY_URL}"
          : "${CLOUDFLARE_ACCESS_CLIENT_ID:?Missing CLOUDFLARE_ACCESS_CLIENT_ID}"
          : "${CLOUDFLARE_ACCESS_CLIENT_SECRET:?Missing CLOUDFLARE_ACCESS_CLIENT_SECRET}"

          deploy_token="${DOKPLOY_DEPLOY_URL##*/}"
          echo "::add-mask::$deploy_token"

          payload=$(jq -nc \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{ref: $ref, head_commit: {id: $sha, message: "CI passed"}, commits: []}')

          curl --fail --silent --show-error --output /dev/null \
            --request POST \
            --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            --header "X-GitHub-Event: push" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DOKPLOY_DEPLOY_URL"
