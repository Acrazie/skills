# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}
  {%- if previous.version %}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Acrazie/skills/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
  {%- else %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
  {%- endif %}
{%- else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**({{ commit.scope }})**: {% endif %}{{ commit.message | upper_first }}\
  {%- if commit.message is not containing("github.com/Acrazie/skills/pull") and commit.message is not containing("#") %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/Acrazie/skills/commit/{{ commit.id }})){% endif %}\
  {%- if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Replace (#123) with markdown link to GitHub PR
  { pattern = '\s*\(#([0-9]+)\)', replace = " ([#${1}](https://github.com/Acrazie/skills/pull/${1}))" },
]
commit_parsers = [
  { message = "^.*!:.*", group = "<!-- 00 -->💥 Breaking Changes" },
  { body = ".*BREAKING CHANGE:.*", group = "<!-- 00 -->💥 Breaking Changes" },
  { message = "^feat", group = "<!-- 01 -->🚀 Features" },
  { message = "^fix", group = "<!-- 02 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 03 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 04 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 05 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 06 -->🎨 Styling" },
  { message = "^test", group = "<!-- 07 -->🧪 Testing" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(main\\): release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore", group = "<!-- 08 -->🔧 Maintenance" },
  { message = "^ci", group = "<!-- 08 -->🔧 Maintenance" },
  { body = ".*category:skip.*", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
